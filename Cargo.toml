[package]
name = "ceos"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
buffer-core = { path = "crates/buffer-core" }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = "0.34"
egui_solarized = "0.34"
env_logger = "0.11"
flate2 = "1.1.9"
humansize = "2.1.3"
log = { workspace = true }
logos = { workspace = true }
num-traits = "0.2.19"
rayon = "1.12.0"
rfd = "0.17.2"
search = { path = "crates/search" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1.2+spec-1.1.0"
highlight = { path = "crates/highlight" }
syntax = { path = "crates/syntax" }
tools = { path = "crates/tools" }

[workspace.dependencies]
eframe = "0.34"
egui = "0.34"
log = "0.4"
logos = "0.16.1"
rstest = "0.26.1"

[dev-dependencies]
rstest = { workspace = true }
criterion = "0.8.2"

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "search_init_bench"
harness = false

[lints.clippy]
unwrap_used = "deny"
#expect_used = "deny"

[workspace]
members = [
    "crates/highlight",
    "crates/search",
    "crates/syntax",
    "crates/tools"
]
