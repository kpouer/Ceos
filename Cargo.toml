[package]
name = "ceos"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eframe = "0.34"
egui = "0.34"
egui_extras = "0.34"
egui_solarized = "0.34"
env_logger = "0.11"
flate2 = "1.1.9"
humansize = "2.1.3"
log = "0.4"
logos = "0.16.1"
lz4 = "1.28.1"
memchr = "2.8"
num-traits = "0.2.19"
rayon = "1.11.0"
regex = "1.12"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1.0+spec-1.1.0"

[dev-dependencies]
rstest = "0.26.1"
criterion = "0.8.2"

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "search_init_bench"
harness = false

[lints.clippy]
unwrap_used = "deny"
#expect_used = "deny"